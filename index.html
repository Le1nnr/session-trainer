<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Session Trainer — подготовка к сессии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;--panel:rgba(20,22,32,.62);--panel2:rgba(255,255,255,.04);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#eef0f7;--mute:#8b90a6;--a1:#7c5cff;--a2:#22d3ee;--a3:#f472b6;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;
  --grad:linear-gradient(120deg,var(--a1),var(--a2));
  --r:18px;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
::selection{background:rgba(124,92,255,.45)}
/* ---------- animated backdrop ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.42;mix-blend-mode:screen;will-change:transform}
.b1{background:radial-gradient(circle,#7c5cff 0,transparent 62%);top:-25vmax;left:-15vmax;animation:drift1 26s ease-in-out infinite alternate}
.b2{background:radial-gradient(circle,#22d3ee 0,transparent 60%);bottom:-30vmax;right:-20vmax;animation:drift2 32s ease-in-out infinite alternate;opacity:.3}
.b3{background:radial-gradient(circle,#f472b6 0,transparent 60%);top:30%;left:45%;width:38vmax;height:38vmax;animation:drift3 22s ease-in-out infinite alternate;opacity:.18}
@keyframes drift1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vw,-12vh) scale(1.1)}}
@keyframes drift3{to{transform:translate(-22vw,10vh) scale(.85)}}
.grid{position:absolute;inset:-50%;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;transform:perspective(600px) rotateX(58deg) translateY(-8%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 60%);animation:gridmove 14s linear infinite}
@keyframes gridmove{to{background-position:0 44px,0 0}}
.noise{position:absolute;inset:0;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* ---------- layout ---------- */
.wrap{max-width:820px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px 120px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 30px -8px rgba(124,92,255,.8);position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine 4.5s var(--ease) infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.brand h1{font:800 20px/1.1 Unbounded,Inter,sans-serif;margin:0;letter-spacing:-.01em}
.brand small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}
h2{font:700 14px/1 Unbounded,Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:30px 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.mute{color:var(--mute)}
/* reveal */
.rv{opacity:0;transform:translateY(18px) scale(.985);animation:rv .7s var(--ease) forwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rv{to{opacity:1;transform:none}}
/* ---------- set switch ---------- */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:5px;gap:0}
.seg .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:13px;background:linear-gradient(120deg,rgba(124,92,255,.35),rgba(34,211,238,.22));border:1px solid rgba(255,255,255,.14);transition:transform .55s var(--spring);box-shadow:0 10px 30px -12px rgba(124,92,255,.7)}
.seg.r .pill{transform:translateX(100%)}
.seg button{position:relative;z-index:1;padding:11px 10px;border-radius:13px;text-align:left;transition:color .3s}
.seg button b{display:block;font:700 13.5px/1.2 Unbounded,Inter,sans-serif}
.seg button span{font-size:12px;color:var(--mute)}
/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:620px){.stats{grid-template-columns:1fr 1fr}}
.stat{padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:96px;position:relative;overflow:hidden}
.stat .v{font:700 26px/1 Unbounded,Inter,sans-serif;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--mute);margin-top:8px}
.ringstat{flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.08)}
.ring .pr{stroke:url(#rg);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.4s var(--ease)}
/* ---------- mode cards ---------- */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.modes{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.modes{grid-template-columns:1fr}}
.mode{--mx:50%;--my:50%;position:relative;text-align:left;padding:18px 16px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .45s var(--ease),border-color .3s,box-shadow .45s var(--ease)}
.mode::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx) var(--my),rgba(124,92,255,.22),transparent 60%);opacity:0;transition:opacity .35s}
.mode:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 22px 50px -26px rgba(124,92,255,.75)}
.mode:hover::before{opacity:1}
.mode:active{transform:scale(.97)}
.mode .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);position:relative;transition:transform .5s var(--spring)}
.mode:hover .ic{transform:rotate(-8deg) scale(1.08)}
.mode .ic svg{width:22px;height:22px;stroke:url(#ig);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode b{display:block;font:700 14.5px/1.25 Unbounded,Inter,sans-serif;margin-top:14px}
.mode span{font-size:12.5px;color:var(--mute);display:block;margin-top:4px}
.mode .arr{position:absolute;right:14px;top:18px;opacity:.0;transform:translateX(-6px);transition:.4s var(--ease)}
.mode:hover .arr{opacity:.7;transform:none}
.mode.hero{grid-column:span 1;background:linear-gradient(140deg,rgba(124,92,255,.32),rgba(34,211,238,.12) 70%),var(--panel)}
.badge{position:absolute;right:12px;bottom:12px;font:600 11px/1 Inter;padding:5px 8px;border-radius:20px;background:rgba(251,113,133,.16);color:var(--bad);border:1px solid rgba(251,113,133,.3)}
/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.setrow:last-child{border-bottom:0}
.tg{flex:none;width:46px;height:28px;border-radius:20px;background:rgba(255,255,255,.1);position:relative;transition:background .35s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .45s var(--spring);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tg.on{background:var(--grad)}
.tg.on::after{transform:translateX(18px)}
/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:600;background:var(--grad);color:#fff;overflow:hidden;transition:transform .3s var(--spring),box-shadow .3s,opacity .2s;box-shadow:0 12px 30px -14px rgba(124,92,255,.9)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:scale(.96)}
.btn.sec{background:var(--panel2);border:1px solid var(--line2);box-shadow:none;color:var(--text)}
.btn:disabled{opacity:.35;pointer-events:none}
.icbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);transition:.3s var(--ease)}
.icbtn:hover{border-color:var(--line2);background:rgba(255,255,255,.07)}
.icbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- test ---------- */
.top{position:sticky;top:0;z-index:10;margin:0 -16px 16px;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(var(--bg) 60%,transparent)}
.toprow{display:flex;align-items:center;gap:10px}
.counter{flex:1;text-align:center;font:700 15px/1 Unbounded,Inter,sans-serif}
.counter small{display:block;font:500 11.5px Inter;color:var(--mute);margin-top:4px}
.prog{height:6px;border-radius:6px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--grad);transition:width .6s var(--ease)}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 1.8s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.qcard{padding:20px 18px}
.enter-next{animation:inR .55s var(--ease) both}
.enter-prev{animation:inL .55s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(40px) scale(.98);filter:blur(4px)}}
@keyframes inL{from{opacity:0;transform:translateX(-40px) scale(.98);filter:blur(4px)}}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.chip.no{font:600 12px Unbounded,Inter;color:var(--text)}
.qtext{font:600 18px/1.45 Inter,sans-serif;margin:14px 0 4px;letter-spacing:-.005em}
pre{position:relative;margin:14px 0 4px;padding:16px 14px 14px;border-radius:14px;background:rgba(5,6,10,.75);border:1px solid var(--line);overflow-x:auto;font:13.5px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:#d6deff;white-space:pre}
pre::before{content:"C#";position:absolute;right:10px;top:8px;font:600 10px Inter;color:var(--mute);letter-spacing:.08em}
.kw{color:#c792ea}.st{color:#a5e88b}.nm{color:#f78c6c}.ty{color:#7fdbff}.cm{color:#676e95}
.opts{margin-top:14px;display:grid;gap:10px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);transition:transform .35s var(--spring),border-color .25s,background .25s;opacity:0;animation:rv .5s var(--ease) forwards;animation-delay:calc(120ms + var(--i)*55ms);overflow:hidden}
.opt:hover{border-color:var(--line2);background:rgba(255,255,255,.06);transform:translateX(3px)}
.opt:active{transform:scale(.98)}
.opt .L{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 13px Unbounded,Inter;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:.3s}
.opt .t{padding-top:4px}
.opt.sel{border-color:rgba(124,92,255,.7);background:rgba(124,92,255,.14)}
.opt.sel .L{background:var(--grad);border-color:transparent}
.opt.ok{border-color:rgba(52,211,153,.75);background:rgba(52,211,153,.12);animation:rv .5s var(--ease) forwards,pop .5s var(--spring)}
.opt.ok .L{background:var(--ok);color:#052;border-color:transparent}
.opt.bad{border-color:rgba(251,113,133,.75);background:rgba(251,113,133,.1);animation:rv .01s forwards,shake .45s var(--ease)}
.opt.bad .L{background:var(--bad);color:#300;border-color:transparent}
.opt.dim{opacity:.45!important}
@keyframes pop{40%{transform:scale(1.025)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.25);transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.verdict{display:flex;gap:12px;align-items:center;margin-top:14px;padding:13px 14px;border-radius:14px;animation:rv .5s var(--ease) both}
.verdict.ok{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35)}
.verdict.bad{background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.3)}
.verdict svg{width:26px;height:26px;flex:none;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.verdict.ok svg{stroke:var(--ok)}.verdict.bad svg{stroke:var(--bad)}
.verdict svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .55s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mute);transition:.3s}
.flag svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.flag.on{color:var(--warn);border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.08)}
.flag.on svg{fill:currentColor}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.nav .in{max-width:820px;margin:0 auto;display:flex;gap:10px}
.nav .btn{flex:1}
.drawer{overflow:hidden;max-height:0;transition:max-height .6s var(--ease),margin .4s;margin-bottom:0}
.drawer.open{max-height:520px;margin-bottom:14px}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;padding:14px;max-height:380px;overflow:auto}
.dot{padding:8px 0;border-radius:10px;font:600 12.5px Inter;background:var(--panel2);border:1px solid var(--line);transition:.25s var(--ease)}
.dot:hover{transform:translateY(-2px)}
.dot.ans{background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.5)}
.dot.ok{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.5)}
.dot.bad{background:rgba(251,113,133,.18);border-color:rgba(251,113,133,.5)}
.dot.cur{outline:2px solid #fff;outline-offset:1px}
.dot.fl{box-shadow:inset 0 -3px 0 var(--warn)}
.timer{display:inline-flex;align-items:center;gap:6px;font:600 12.5px "JetBrains Mono";color:var(--mute)}
.timer.low{color:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
/* ---------- result ---------- */
.res{padding:28px 18px;text-align:center;position:relative;overflow:hidden}
.bigring{width:190px;height:190px;margin:0 auto;position:relative}
.bigring svg{width:100%;height:100%}
.bigring circle{fill:none;stroke-width:12;stroke-linecap:round}
.bigring .pr{transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.8s var(--ease)}
.bigring .num{position:absolute;inset:0;display:grid;place-items:center;font:800 44px/1 Unbounded,Inter}
.bigring .num small{display:block;font:500 13px Inter;color:var(--mute);margin-top:6px;text-align:center}
.grade{font:700 18px Unbounded,Inter;margin-top:16px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media(max-width:480px){.btnrow{grid-template-columns:1fr}}
.qa{padding:16px;border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0}
.qa .n{font:600 12px Unbounded,Inter;color:var(--mute)}
.qa .q{font-weight:600;margin-top:4px}
.qa .o{font-size:14px;color:var(--mute);padding:3px 0 3px 10px;border-left:2px solid transparent;margin-top:3px}
.qa .o.c{color:var(--ok);border-left-color:var(--ok);font-weight:600}
.qa .o.w{color:var(--bad);border-left-color:var(--bad)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
/* ---------- review ---------- */
.search{display:flex;align-items:center;gap:10px;padding:0 14px}
.search svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;padding:14px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:20px;font-size:13px;background:var(--panel2);border:1px solid var(--line);transition:.3s var(--ease);white-space:nowrap}
.fchip.on{background:var(--grad);border-color:transparent;color:#fff}
mark{background:rgba(251,191,36,.3);color:#fff;border-radius:4px;padding:0 2px}
.reveal{margin-top:8px;font-size:13px;padding:7px 12px;border-radius:10px;border:1px dashed var(--line2);color:var(--mute)}
/* ---------- form ---------- */
.field{padding:14px 16px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:8px}
select,input[type=number]{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;padding:11px 12px;outline:0;transition:border-color .3s}
select:focus,input:focus{border-color:rgba(124,92,255,.7)}
select option{background:#141622}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(3,4,8,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s both}
.modal .box{width:100%;max-width:380px;padding:22px;animation:mIn .5s var(--spring) both}
@keyframes fade{from{opacity:0}}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.92)}}
.toast{position:fixed;left:50%;bottom:110px;z-index:80;transform:translateX(-50%);padding:12px 18px;border-radius:14px;font-size:14px;animation:tIn .5s var(--spring) both;white-space:nowrap}
@keyframes tIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}}
.hist{padding:6px 0}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 16px}
.hbar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:6px;transform-origin:left;animation:grow 1s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.tip{display:flex;gap:12px;padding:14px 16px;margin-top:12px;font-size:13.5px;color:#cfd3e6}
.tip svg{width:20px;height:20px;flex:none;stroke:var(--warn);fill:none;stroke-width:2}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="noise"></div></div>
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
 <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs></svg>
<canvas id="fx"></canvas>
<div class="wrap" id="app"></div>
<script>
const Q1=[{"n": 1, "q": "Что является ключевой концепцией парадигмы объектно-ориентированного программирования?", "code": "", "o": ["Использование только глобальных переменных и процедур", "Последовательное выполнение функций сверху вниз без хранения состояния", "Представление программы как набора взаимодействующих объектов, объединяющих данные и поведение", "Запись программы исключительно в виде математических формул"], "a": 2}, {"n": 2, "q": "Что выведет данный код на C# при вызове метода?", "code": "class Person\n{\n    public string Name = \"Alex\";\n}\nPerson p = new Person();\nConsole.Write(p.Name);", "o": ["Ошибка компиляции", "Alex", "null", "Name"], "a": 1}, {"n": 3, "q": "Какой модификатор доступа делает элемент класса доступным ТОЛЬКО внутри этого же класса?", "code": "", "o": ["public", "protected", "private", "internal"], "a": 2}, {"n": 4, "q": "Какую роль выполняет конструктор класса в C#?", "code": "", "o": ["Инициализирует новый объект при его создании", "Объявляет статические методы класса", "Удаляет объект из памяти", "Запрещает создание экземпляров класса"], "a": 0}, {"n": 5, "q": "Что выведет следующий фрагмент кода на C#?", "code": "class Car\n{\n    public int Speed;\n    public Car(int speed)\n    {\n        Speed = speed;\n    }\n}\nCar c = new Car(100);\nConsole.Write(c.Speed);", "o": ["Ошибка компиляции", "0", "100", "speed"], "a": 2}, {"n": 6, "q": "Что понимается под инкапсуляцией в ООП?", "code": "", "o": ["Разделение программы на несколько файлов", "Возможность объекта принимать разные формы", "Сокрытие внутреннего состояния объекта и доступ к нему только через публичные методы/свойства", "Возможность создавать класс на основе другого класса"], "a": 2}, {"n": 7, "q": "Какой модификатор доступа в C# разрешает доступ к члену класса в пределах текущей сборки (.dll/.exe)?", "code": "", "o": ["sealed", "private", "protected", "internal"], "a": 3}, {"n": 8, "q": "Что выведет данный код при попытке обращения к приватной переменной?", "code": "class Account\n{\n    private int balance = 500;\n}\nAccount acc = new Account();\nConsole.Write(acc.balance);", "o": ["Ошибка компиляции: член balance недоступен из-за уровня защиты", "500", "0", "null"], "a": 0}, {"n": 9, "q": "Для чего в C# используются автосвойства (Auto-Properties)?", "code": "", "o": ["Для запрета изменения значения поля", "Для краткого объявления свойства, у которого компилятор сам создаёт скрытое поле", "Для автоматического создания конструктора", "Для автоматической сериализации класса в JSON"], "a": 1}, {"n": 10, "q": "Что выведет фрагмент кода на C# с использованием свойства с логикой?", "code": "class User\n{\n    private int _age;\n    public int Age\n    {\n        get => _age;\n        set => _age = value < 0 ? 0 : value;\n    }\n}\nUser u = new User();\nu.Age = -15;\nConsole.Write(u.Age);", "o": ["15", "-15", "0", "Ошибка компиляции"], "a": 2}, {"n": 11, "q": "Какое ключевое слово в C# используется для наследования одного класса от другого?", "code": "", "o": ["extends", "inherits", "Двоеточие «:» после имени класса", "implements"], "a": 2}, {"n": 12, "q": "Что выведет этот код при вызове унаследованного метода?", "code": "class Animal\n{\n    public void Eat() => Console.Write(\"Food\");\n}\nclass Dog : Animal { }\nDog d = new Dog();\nd.Eat();", "o": ["Ошибка компиляции", "Ничего не выведет", "Dog", "Food"], "a": 3}, {"n": 13, "q": "Какое ключевое слово в C# используется в базовом классе, чтобы разрешить дочернему классу переопределить метод?", "code": "", "o": ["sealed", "virtual", "override", "new"], "a": 1}, {"n": 14, "q": "Какое ключевое слово используется в дочернем классе C# для переопределения виртуального метода базового класса?", "code": "", "o": ["base", "virtual", "override", "static"], "a": 2}, {"n": 15, "q": "Что выведет следующий фрагмент кода с полиморфизмом?", "code": "class Printer\n{\n    public virtual void Print() => Console.Write(\"Base\");\n}\nclass ColorPrinter : Printer\n{\n    public override void Print() => Console.Write(\"Color\");\n}\nPrinter p = new ColorPrinter();\np.Print();", "o": ["Ошибка компиляции", "Color", "BaseColor", "Base"], "a": 1}, {"n": 16, "q": "Что выведет данный код при обращении к базовому классу через ключевое слово base?", "code": "class Parent\n{\n    public virtual void Greet() => Console.Write(\"Hi\");\n}\nclass Child : Parent\n{\n    public override void Greet()\n    {\n        base.Greet();\n        Console.Write(\"!\");\n    }\n}\nChild c = new Child();\nc.Greet();", "o": ["!Hi", "Hi!", "!", "Hi"], "a": 1}, {"n": 17, "q": "Какое ключевое слово запрещает дальнейшее наследование от данного класса в C#?", "code": "", "o": ["readonly", "const", "static", "sealed"], "a": 3}, {"n": 18, "q": "Какая ошибка произойдет при попытке унаследоваться от класса с модификатором sealed?", "code": "sealed class FinalClass { }\nclass SubClass : FinalClass { }", "o": ["Ошибка во время выполнения InvalidOperationException", "Предупреждение, но программа скомпилируется", "Ошибка компиляции CS0509: нельзя наследовать от запечатанного (sealed) класса", "Ошибок не будет"], "a": 2}, {"n": 19, "q": "Что такое абстрактный класс в C#?", "code": "", "o": ["Класс, все члены которого статические", "Класс, который содержит только поля без методов", "Класс, экземпляр которого нельзя создать; служит базой и может содержать абстрактные методы без реализации", "Класс, от которого запрещено наследоваться"], "a": 2}, {"n": 20, "q": "Что выведет следующий фрагмент кода с абстрактным классом?", "code": "abstract class Appliance\n{\n    public abstract void TurnOn();\n}\nclass Lamp : Appliance\n{\n    public override void TurnOn() => Console.Write(\"Light\");\n}\nAppliance a = new Lamp();\na.TurnOn();", "o": ["Light", "Ошибка компиляции: нельзя создать абстрактный класс", "Ничего не выведет", "TurnOn"], "a": 0}, {"n": 21, "q": "Что представляет собой интерфейс (interface) в C#?", "code": "", "o": ["Класс, от которого можно создать объект", "Контракт — набор членов, которые обязан реализовать класс, без хранения состояния", "Специальный тип для хранения чисел", "Графический элемент пользовательского интерфейса"], "a": 1}, {"n": 22, "q": "Какое ключевое слово используется для реализации интерфейса классом в C#?", "code": "", "o": ["interface", "uses", "implements", "Двоеточие «:» (как и при наследовании)"], "a": 3}, {"n": 23, "q": "Сколько интерфейсов может одновременно реализовать один класс в C#?", "code": "", "o": ["Любое количество", "Не более пяти", "Только один", "Не более двух"], "a": 0}, {"n": 24, "q": "Что выведет код при явной реализации интерфейса в C#?", "code": "interface IRunner\n{\n    void Run();\n}\nclass Athlete : IRunner\n{\n    void IRunner.Run() => Console.Write(\"Running\");\n}\nIRunner r = new Athlete();\nr.Run();", "o": ["Ничего не выведет", "Ошибка компиляции", "Running", "Run"], "a": 2}, {"n": 25, "q": "Какое ключевое слово в C# позволяет создать статический метод или класс, доступный без создания объекта?", "code": "", "o": ["static", "virtual", "sealed", "const"], "a": 0}, {"n": 26, "q": "Что выведет следующий фрагмент кода со статическим свойством?", "code": "class Counter\n{\n    public static int Count = 0;\n    public Counter()\n    {\n        Count++;\n    }\n}\nnew Counter();\nnew Counter();\nConsole.Write(Counter.Count);", "o": ["0", "2", "Ошибка компиляции", "1"], "a": 1}, {"n": 27, "q": "В чем главное различие между типом значения (struct) и ссылочным типом (class) в C#?", "code": "", "o": ["class нельзя передать в метод", "Никакой разницы нет", "struct может наследоваться, а class — нет", "struct хранит само значение и копируется при присваивании, class хранит ссылку на объект в куче"], "a": 3}, {"n": 28, "q": "Что выведет следующий фрагмент кода при передаче структуры в метод?", "code": "struct Point\n{\n    public int X;\n}\nstatic void Change(Point p)\n{\n    p.X = 100;\n}\nPoint pt = new Point { X = 10 };\nChange(pt);\nConsole.Write(pt.X);", "o": ["100", "Ошибка компиляции", "110", "10"], "a": 3}, {"n": 29, "q": "Что выведет аналогичный фрагмент кода при передаче КЛАССА в метод?", "code": "class PointClass\n{\n    public int X;\n}\nstatic void Change(PointClass p)\n{\n    p.X = 100;\n}\nPointClass pt = new PointClass { X = 10 };\nChange(pt);\nConsole.Write(pt.X);", "o": ["Ошибка компиляции", "100", "10", "110"], "a": 1}, {"n": 30, "q": "Для чего в C# 9.0+ используются типы записей (record)?", "code": "", "o": ["Для неизменяемых объектов данных со сравнением по значению", "Для записи данных в файл", "Для создания статических классов", "Для логирования ошибок"], "a": 0}, {"n": 31, "q": "Что выведет данный фрагмент C# кода при сравнении двух записей (record)?", "code": "public record Item(string Name, int Price);\nItem i1 = new Item(\"Pen\", 10);\nItem i2 = new Item(\"Pen\", 10);\nConsole.Write(i1 == i2);", "o": ["Pen10", "False", "True", "Ошибка компиляции"], "a": 2}, {"n": 32, "q": "Какое ключевое слово позволяет передать параметр в метод по ссылке (by reference) с возможностью его изменения?", "code": "", "o": ["in", "params", "var", "ref"], "a": 3}, {"n": 33, "q": "Что выведет данный код с использованием модификатора ref?", "code": "static void Modify(ref int n) => n += 5;\nint num = 10;\nModify(ref num);\nConsole.Write(num);", "o": ["15", "5", "10", "Ошибка компиляции"], "a": 0}, {"n": 34, "q": "В чем отличие модификатора out от ref в C#?", "code": "", "o": ["out не требует инициализации переменной до вызова, но метод обязан присвоить ей значение", "out передаёт параметр по значению, ref — по ссылке", "Отличий нет", "ref используется только для строк"], "a": 0}, {"n": 35, "q": "Что выведет следующий фрагмент кода с ключевым словом this?", "code": "class Box\n{\n    private int w;\n    public Box(int w)\n    {\n        this.w = w;\n    }\n    public int GetW() => w;\n}\nBox b = new Box(42);\nConsole.Write(b.GetW());", "o": ["w", "42", "0", "Ошибка компиляции"], "a": 1}, {"n": 36, "q": "Что произойдет при вызове деструктора (~ClassName()) в C#?", "code": "", "o": ["Возникает ошибка компиляции при любом объявлении деструктора", "Создаётся копия объекта", "Объект удаляется сразу в момент вызова программистом", "Его вызывает сборщик мусора автоматически перед уничтожением объекта; вызвать явно нельзя"], "a": 3}, {"n": 37, "q": "Что произойдет, если в классе объявлено несколько методов с одинаковым именем, но разными типами/количеством параметров?", "code": "", "o": ["Переопределение методов (override)", "Перегрузка методов — компилятор выберет нужный по параметрам", "Будет вызываться всегда последний объявленный метод", "Ошибка компиляции: имена методов должны быть уникальны"], "a": 1}, {"n": 38, "q": "Что выведет следующий перегруженный метод?", "code": "class Calc\n{\n    public int Add(int a, int b) => a + b;\n    public string Add(string a, string b) => a + b;\n}\nCalc c = new Calc();\nConsole.Write(c.Add(\"1\", \"2\"));", "o": ["12", "1 2", "3", "Ошибка компиляции"], "a": 0}, {"n": 39, "q": "Что означает аббревиатура SOLID в проектировании программного обеспечения?", "code": "", "o": ["Пять принципов ООП-проектирования: SRP, OCP, LSP, ISP, DIP", "Набор паттернов для работы с потоками", "Язык запросов к базе данных", "Стандарт оформления кода C#"], "a": 0}, {"n": 40, "q": "В чем заключается принцип единой ответственности (Single Responsibility Principle — SRP)?", "code": "", "o": ["В программе должен быть только один класс", "Класс должен иметь только один метод", "Класс должен иметь только один экземпляр", "У класса должна быть только одна причина для изменения (одна ответственность)"], "a": 3}, {"n": 41, "q": "Какая проблема возникает, если класс нарушает принцип SRP (является God Object / Божественным объектом)?", "code": "", "o": ["Класс становится огромным, сильно связанным, его сложно изменять и тестировать", "Программа начинает работать быстрее", "Уменьшается объём памяти", "Класс невозможно скомпилировать"], "a": 0}, {"n": 42, "q": "В чем заключается принцип открытости/закрытости (Open/Closed Principle — OCP)?", "code": "", "o": ["Сущности открыты для расширения, но закрыты для изменения", "Код должен быть открытым (open source)", "Все поля класса должны быть открытыми", "Класс нельзя расширять наследованием"], "a": 0}, {"n": 43, "q": "Что утверждает принцип подстановки Барбары Лисков (Liskov Substitution Principle — LSP)?", "code": "", "o": ["Подкласс обязан переопределить все методы базового", "Базовый класс должен знать обо всех наследниках", "Наследоваться можно только от одного класса", "Объекты подкласса должны заменять объекты базового класса без нарушения работы программы"], "a": 3}, {"n": 44, "q": "В чем заключается принцип разделения интерфейса (Interface Segregation Principle — ISP)?", "code": "", "o": ["Лучше много маленьких специализированных интерфейсов, чем один «толстый»", "Все интерфейсы надо объединять в один", "Интерфейс должен содержать минимум 10 методов", "Классу нельзя реализовать больше одного интерфейса"], "a": 0}, {"n": 45, "q": "В чем состоит принцип инверсии зависимостей (Dependency Inversion Principle — DIP)?", "code": "", "o": ["Нижние модули должны зависеть от верхних", "Нужно избегать интерфейсов", "Модули верхнего уровня зависят от абстракций, а не от конкретных реализаций", "Зависимости создаются только через new внутри класса"], "a": 2}, {"n": 46, "q": "Какая проблема связности кода обозначается термином «Высокая связность» (High Coupling)?", "code": "", "o": ["Каждый модуль полностью независим", "Код выполняется слишком медленно", "Модули сильно зависят друг от друга, изменение одного ломает другие", "Модули обмениваются данными через интерфейсы"], "a": 2}, {"n": 47, "q": "К какому качеству кода следует стремиться при проектировании модулей C#?", "code": "", "o": ["Слабая связанность (Low Coupling) и высокая связность/сцепление (High Cohesion)", "Максимальное число глобальных переменных", "Сильная связанность и низкая связность", "Один большой класс на весь проект"], "a": 0}, {"n": 48, "q": "Что выведет данный блок обработки исключений на C#?", "code": "try\n{\n    int x = 0;\n    int y = 10 / x;\n}\ncatch (DivideByZeroException)\n{\n    Console.Write(\"ZeroErr\");\n}\nfinally\n{\n    Console.Write(\"Finally\");\n}", "o": ["ZeroErrFinally", "Программа аварийно завершится", "Finally", "ZeroErr"], "a": 0}, {"n": 49, "q": "Что выведет данный код при генерации пользовательского исключения?", "code": "static void CheckAge(int age)\n{\n    if (age < 0) throw new ArgumentException(\"Invalid\");\n}\ntry\n{\n    CheckAge(-5);\n}\ncatch (ArgumentException ex)\n{\n    Console.Write(ex.Message);\n}", "o": ["Ничего не выведет", "ArgumentException", "-5", "Invalid"], "a": 3}, {"n": 50, "q": "В чем главное отличие между вызовом throw; и throw ex; внутри блока catch (Exception ex)?", "code": "", "o": ["throw; не пробрасывает исключение дальше", "throw ex; сохраняет стек, а throw; — нет", "Отличий нет", "throw; сохраняет исходный стек вызовов, throw ex; сбрасывает его на текущую строку"], "a": 3}, {"n": 51, "q": "Какой паттерн проектирования (Design Pattern) гарантирует наличие только одного экземпляра класса в системе?", "code": "", "o": ["Strategy", "Factory Method", "Observer", "Singleton (Одиночка)"], "a": 3}, {"n": 52, "q": "Что выведет данный C# код, реализующий паттерн Singleton?", "code": "class Singleton\n{\n    private static Singleton _instance;\n    public static Singleton Instance => _instance ??= new Singleton();\n}\nvar s1 = Singleton.Instance;\nvar s2 = Singleton.Instance;\nConsole.Write(s1 == s2);", "o": ["False", "null", "True", "Ошибка компиляции"], "a": 2}, {"n": 53, "q": "Для чего применяется паттерн «Фабричный метод» (Factory Method)?", "code": "", "o": ["Чтобы менять алгоритм во время выполнения", "Чтобы делегировать создание объектов подклассам/методу, не указывая конкретный класс", "Чтобы гарантировать один экземпляр класса", "Чтобы удалять объекты из памяти"], "a": 1}, {"n": 54, "q": "Для чего используется паттерн «Стратегия» (Strategy)?", "code": "", "o": ["Чтобы создать единственный экземпля /* --- tiny C# highlighter --- */
function hl(code){
  const KW=/\b(class|public|private|static|void|new|int|string|double|bool|object|var|return|if|else|try|catch|finally|throw|using|interface|abstract|virtual|override|sealed|struct|record|enum|out|ref|this|base|null|true|false|readonly|get|set|is|as|byte)\b/g;
  return code.split(/("(?:\\.|[^"\\])*")/g).map((p,i)=>{
    if(i%2) return `<span class="st">${esc(p)}</span>`;
    return esc(p).replace(KW,'<span class="kw">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="nm">$1</span>').replace(/\b(Console|Convert|DateTime|Enum|Environment|System|File|Encoding|JsonSerializer|ArgumentException|ArgumentNullException|Exception|DivideByZeroException|IndexOutOfRangeException|IDisposable)\b/g,'<span class="ty">$1</span>');
  }).join('');
}

function countUp(el,to,suf=''){if(RM||!to){el.textContent=to+suf;return}const t0=performance.now(),d=1100;const f=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suf;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

  <div class="modes">
    ${modeCard('stack','Полный тест',`Все ${total} вопросов подряд`,"start(pick(999,'all'),'Полный тест')",d(),'hero')}
    ${modeCard('dice','Случайные 30','Как на настоящем экзамене',"start(pick(30,'all'),'Случайные 30')",d())}
    ${modeCard('redo','Работа над ошибками',w.size?`${w.size} вопр. ждут повтора`:'Пока ошибок нет',"startWrong()",d(),'',w.size)}
    ${modeCard('brain','Невыученные','Ещё не отвечены верно 2 раза подряд',"startNew()",d())}
    ${modeCard('sliders','Свой тест','Тема, диапазон, количество',"custom()",d())}
    ${modeCard('book','Все ответы','Шпаргалка с поиском',"review()",d())}
  </div>
  ${cur.id==='kz'?`<div class="panel tip rv" ${d()}>${ic('bulb')}<div>В этом сборнике правильные ответы идут по кругу <b>A → B → C → D → E</b> (в 8.4 круг начинается заново с A). Чтобы реально учить, а не угадывать по порядку, включи «Перемешивать варианты».</div></div>`:''}
  <h2 class="rv" ${d()}>Настройки</h2>
  <div class="panel rv" ${d()}>
    ${tg('instant','Показывать правильный ответ сразу')}${tg('shuffleQ','Перемешивать вопросы')}${tg('shuffleO','Перемешивать варианты ответов')}${tg('timer','Таймер — 1 минута на вопрос')}
  </div>
  ${hist.length?`<h2 class="rv" ${d()}>История</h2><div class="panel hist rv" ${d()}>${hist.slice(-6).reverse().map((h,j)=>`<div class="hrow"><span style="width:118px;font-size:13px" class="mute">${esc(h.t)}</span><div class="hbar"><i style="width:${h.p}%;background:${h.p>=75?'var(--ok)':h.p>=50?'var(--warn)':'var(--bad)'};animation-delay:${j*80}ms"></i></div><b style="width:44px;text-align:right;font-family:Unbounded">${h.p}%</b></div>`).join('')}
    <div style="padding:6px 16px 12px"><button class="btn sec" style="width:100%;padding:11px" onclick="ask('Сбросить прогресс этого сборника?',()=>{['hist','wrong','known'].forEach(k=>store.set(sk(k),k==='known'?{}:[]));home()})">Сбросить прогресс</button></div></div>`:''}
  `;
  document.querySelectorAll('[data-c]').forEach(el=>setTimeout(()=>countUp(el,+el.dataset.c,el.dataset.s||''),250));
  requestAnimationFrame(()=>setTimeout(()=>{const r=$('#lr');if(r)r.style.strokeDashoffset=C*(1-learned/total)},200));
  scrollTo({top:0});
}
function modeCard(icn,t,s,fn,d,cls='',badge=0){return`<button class="panel mode ${cls} rv" ${d} onclick="${fn}"><div class="ic">${ic(icn)}</div><svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg><div><b>${t}</b><span>${s}</span></div>${badge?`<span class="badge">${badge}</span>`:''}</button>`}
function tg(k,label){return`<div class="setrow" onclick="this.querySelector('.tg').classList.toggle('on');setS('${k}',this.querySelector('.tg').classList.contains('on'))"><span>${label}</span><span class="tg ${settings[k]?'on':''}"></span></div>`}
function setS(k,v){settings[k]=v;store.set('settings',settings)}
function switchSet(id){if(cur.id===id)return;cur=SETS[id];store.set('set',id);$('#seg').classList.toggle('r',id==='kz');setTimeout(home,380)}
function pick(n,topic,from=1,to=999){
  let pool=cur.q.filter(q=>q.n>=from&&q.n<=to);
  if(topic&&topic!=='all'){const t=cur.topics.find(x=>x.id===topic);pool=pool.filter(q=>q.n>=t.from&&q.n<=t.to)}
  if(n<pool.length||settings.shuffleQ)pool=shuffle(pool);
  pool=pool.slice(0,n);if(!settings.shuffleQ)pool.sort((a,b)=>a.n-b.n);return pool;
}
function startWrong(){const w=wrongSet();if(!w.size){toast('Ошибок пока нет — пройди любой тест');return}start(shuffle(cur.q.filter(q=>w.has(q.n))),'Работа над ошибками')}
function startNew(){const k=known(),p=cur.q.filter(q=>(k[q.n]||0)<2);if(!p.length){toast('Все вопросы выучены!');return}start(shuffle(p).slice(0,30),'Невыученные')}

function start(list,title){
  T={title,items:list.map(q=>({q,order:settings.shuffleO?shuffle(q.o.map((_,i)=>i)):q.o.map((_,i)=>i),pick:null,flag:false})),i:0,dir:'next',instant:settings.instant,t0:Date.now(),limit:settings.timer?list.length*60:0,grid:false};
  if(T.limit)startTimer();render();
}
let timerId=null;
function startTimer(){stopTimer();timerId=setInterval(()=>{const left=T.limit-((Date.now()-T.t0)/1000|0),el=$('#tm');if(left<=0){stopTimer();finish(true);return}if(el){el.lastChild.textContent=fmtT(left);el.classList.toggle('low',left<60)}},1000)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
const fmtT=s=>`${s/60|0}:${String(s%60).padStart(2,'0')}`;
const isOk=it=>it.pick!==null&&it.order[it.pick]===it.q.a;

function render(){
  const it=T.items[T.i],q=it.q,answered=T.items.filter(x=>x.pick!==null).length,show=T.instant&&it.pick!==null;
  const left=T.limit?Math.max(0,T.limit-((Date.now()-T.t0)/1000|0)):0;
  app.innerHTML=`
  <div class="top"><div class="toprow">
    <button class="icbtn" onclick="ask('Выйти из теста? Результат не сохранится.',home)" aria-label="Выйти">${ic('x')}</button>
    <div class="counter">${T.i+1} <span class="mute">/ ${T.items.length}</span><small>${esc(T.title)}</small></div>
    ${T.limit?`<span class="timer ${left<60?'low':''}" id="tm">${ic('clock').replace('<svg','<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"')}<span>${fmtT(left)}</span></span>`:''}
    <button class="icbtn" onclick="T.grid=!T.grid;$('#dr').classList.toggle('open',T.grid)" aria-label="Все вопросы">${ic('grid')}</button>
  </div><div class="prog"><i style="width:${answered/T.items.length*100}%"></i></div></div>
  <div class="drawer ${T.grid?'open':''}" id="dr"><div class="panel"><div class="dots">${T.items.map((x,j)=>{let c='dot';if(x.pick!==null)c+=T.instant?(isOk(x)?' ok':' bad'):' ans';if(j===T.i)c+=' cur';if(x.flag)c+=' fl';return`<button class="${c}" onclick="go(${j})">${j+1}</button>`}).join('')}</div>
    <div class="mute" style="font-size:12.5px;padding:0 14px 12px">Отвечено ${answered} из ${T.items.length}${T.items.some(x=>x.flag)?' · жёлтая полоска — отмеченные':''}</div></div></div>
  <div class="panel qcard enter-${T.dir}" id="qc">
    <div class="qmeta"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip no">№${q.n}</span><span class="chip">${esc(topicOf(q.n).name)}</span></div>
      <button class="flag ${it.flag?'on':''}" onclick="T.items[T.i].flag=!T.items[T.i].flag;this.classList.toggle('on')">${ic('flag')}${it.flag?'Отмечен':'Отметить'}</button></div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.code?`<pre>${hl(q.code)}</pre>`:''}
    <div class="opts">${it.order.map((oi,k)=>{let c='opt';if(show){if(oi===q.a)c+=' ok';else if(k===it.pick)c+=' bad';else c+=' dim'}else if(k===it.pick)c+=' sel';
      return`<button class="${c}" style="--i:${k}" onclick="answer(${k})" ${show?'disabled':''}><span class="L">${L[k]}</span><span class="t">${esc(q.o[oi])}</span></button>`}).join('')}</div>
    ${show?(isOk(it)?`<div class="verdict ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><b>Верно!</b></div>`:`<div class="verdict bad"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg><div>Правильный ответ: <b>${L[it.order.indexOf(q.a)]}</b> — ${esc(q.o[q.a])}</div></div>`):''}
  </div>
  <div class="nav"><div class="in">
    <button class="btn sec" onclick="go(T.i-1)" ${T.i===0?'disabled':''}>${ic('back').replace('<svg','<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"')} Назад</button>
    ${T.i<T.items.length-1?`<button class="btn" onclick="go(T.i+1)">Далее ${ic('fwd').replace('<svg','<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"')}</button>`:`<button class="btn" onclick="finish()">Завершить</button>`}
  </div></div>`;
}
function go(j){if(j<0||j>=T.items.length)return;T.dir=j<T.i?'prev':'next';T.i=j;render();scrollTo({top:0,behavior:RM?'auto':'smooth'})}
function answer(k){
  const it=T.items[T.i];if(T.instant&&it.pick!==null)return;
  it.pick=k;
  if(T.instant){record(it);T.dir='none';render();if(isOk(it))burst(document.querySelector('.opt.ok'),14)}
  else{T.dir='none';render();setTimeout(()=>{if(T&&T.items[T.i]===it&&T.i<T.items.length-1)go(T.i+1)},320)}
}
function record(it){const ok=isOk(it),w=wrongSet(),k=known();if(ok){k[it.q.n]=(k[it.q.n]||0)+1;if(k[it.q.n]>=2)w.delete(it.q.n)}else{k[it.q.n]=0;w.add(it.q.n)}store.set(sk('wrong'),[...w]);store.set(sk('known'),k)}
document.addEventListener('keydown',e=>{if(!T||T.done||document.querySelector('.modal'))return;const m={'1':0,'2':1,'3':2,'4':3,'5':4,a:0,b:1,c:2,d:3,e:4,'ф':0,'и':1,'с':2,'в':3,'у':4}[e.key.toLowerCase()];
  if(m!==undefined&&m<T.items[T.i].order.length)answer(m);else if(e.key==='ArrowRight'||e.key==='Enter')go(T.i+1);else if(e.key==='ArrowLeft')go(T.i-1)});

function finish(timeout,force){
  const un=T.items.filter(x=>x.pick===null).length;
  if(!timeout&&un&&!force){ask(`Без ответа: ${un}. Всё равно завершить?`,()=>finish(false,true));return}
  stopTimer();T.done=true;
  if(!T.instant)T.items.forEach(it=>{if(it.pick!==null)record(it)});
  const n=T.items.length,c=T.items.filter(isOk).length,p=Math.round(c/n*100);
  const hist=store.get(sk('hist'),[]);hist.push({t:T.title,c,n,p,d:Date.now()});store.set(sk('hist'),hist.slice(-50));
  const bad=T.items.filter(x=>!isOk(x)),secs=(Date.now()-T.t0)/1000|0;
  const grade=p>=90?'Отлично':p>=75?'Хорошо':p>=50?'Удовлетворительно':'Нужно повторить';
  const col=p>=75?'var(--ok)':p>=50?'var(--warn)':'var(--bad)',C=2*Math.PI*80;
  app.innerHTML=`
   <div class="panel res rv">
     ${timeout?'<div class="chip" style="color:var(--bad);margin-bottom:12px">Время вышло</div>':''}
     <div class="bigring"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="80" stroke="rgba(255,255,255,.07)"/><circle class="pr" id="br" cx="95" cy="95" r="80" stroke="${col}" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="filter:drop-shadow(0 0 12px ${col})"/></svg>
       <div class="num"><div><span id="pn">0</span>%<small>${c} из ${n}</small></div></div></div>
     <div class="grade" style="color:${col}">${grade}</div>
     <div class="mute" style="font-size:13px;margin-top:4px">${esc(T.title)} · время ${fmtT(secs)}</div>
     <div class="btnrow">${bad.length?`<button class="btn" onclick="start(shuffle(T.items.filter(x=>!isOk(x)).map(x=>x.q)),'Повтор ошибок')">${ic('redo').replace('<svg','<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"')} Повторить ошибки (${bad.length})</button>`:''}
       <button class="btn sec" onclick="home()" ${bad.length?'':'style="grid-column:1/-1"'}>На главную</button></div>
   </div>
   ${bad.length?`<h2 class="rv" style="--i:2">Разбор ошибок</h2><div class="panel rv" style="--i:3">${bad.map(x=>`<div class="qa"><div class="n">№${x.q.n}</div><div class="q">${esc(x.q.q)}</div>${x.q.code?`<pre>${hl(x.q.code)}</pre>`:''}
     ${x.pick!==null?`<div class="o w">Твой ответ: ${esc(x.q.o[x.order[x.pick]])}</div>`:'<div class="o w">Без ответа</div>'}<div class="o c">Правильно: ${esc(x.q.o[x.q.a])}</div></div>`).join('')}</div>`:''}`;
  scrollTo({top:0});
  setTimeout(()=>{$('#br').style.strokeDashoffset=C*(1-p/100);countUp($('#pn'),p)},200);
  if(p>=75)setTimeout(()=>confetti(),900);
}

function custom(){
  const qs=cur.q.map(q=>q.n),mn=Math.min(...qs),mx=Math.max(...qs);
  app.innerHTML=`<div class="toprow rv" style="margin-bottom:18px"><button class="icbtn" onclick="home()">${ic('back')}</button><div class="brand" style="margin:0"><h1 style="font:800 20px Unbounded">Свой тест</h1></div></div>
  <div class="panel rv" style="--i:1">
   <div class="field"><label>Тема</label><select id="ct"><option value="all">Все темы</option>${cur.topics.map(t=>`<option value="${t.id}">${esc(t.name)} (${t.from}–${t.to})</option>`).join('')}</select></div>
   <div class="field"><label>Диапазон номеров</label><div class="two"><input type="number" id="cf" value="${mn}" min="${mn}" max="${mx}"><input type="number" id="cto" value="${mx}" min="${mn}" max="${mx}"></div></div>
   <div class="field"><label>Количество вопросов</label><div class="chips" style="padding-top:0">${[10,20,30,50,'Все'].map(v=>`<button class="fchip ${v===20?'on':''}" onclick="document.querySelectorAll('#cnt .fchip,.field .fchip').forEach(c=>c.classList.remove('on'));this.classList.add('on');$('#cn').value='${v==='Все'?999:v}'">${v}</button>`).join('')}</div><input type="number" id="cn" value="20" min="1" style="margin-top:8px"></div>
  </div>
  <button class="btn rv" style="--i:2;width:100%;margin-top:14px" onclick="goCustom()">Начать</button>`;
}
function goCustom(){const f=+$('#cf').value||1,to=+$('#cto').value||999,n=Math.max(1,+$('#cn').value||20);const l=pick(n,$('#ct').value,Math.min(f,to),Math.max(f,to));if(!l.length){toast('Нет вопросов под эти условия');return}start(l,'Свой тест')}

let rvTopic='all',rvWrong=false;
function review(){
  rvTopic='all';rvWrong=false;
  app.innerHTML=`<div class="toprow rv" style="margin-bottom:16px"><button class="icbtn" onclick="home()">${ic('back')}</button><div><h1 style="font:800 20px Unbounded;margin:0">Все ответы</h1><div class="mute" style="font-size:12.5px">${esc(cur.title)}</div></div></div>
   <div class="panel search rv" style="--i:1">${ic('search')}<input id="rs" placeholder="Поиск по вопросу, коду или ответу" oninput="drawReview()"></div>
   <div class="chips rv" style="--i:2"><button class="fchip" data-t="all">Все</button>${cur.topics.map(t=>`<button class="fchip" data-t="${t.id}">${esc(t.name)}</button>`).join('')}<button class="fchip" id="ow">Мои ошибки</button><button class="fchip" id="hid">Скрыть ответы</button></div>
   <div id="rl" style="margin-top:10px"></div>`;
  document.querySelectorAll('.fchip[data-t]').forEach(c=>c.onclick=()=>{rvTopic=c.dataset.t;drawReview()});
  $('#ow').onclick=()=>{rvWrong=!rvWrong;drawReview()};$('#hid').onclick=e=>{e.target.classList.toggle('on');drawReview()};
  drawReview();
}
function drawReview(){
  document.querySelectorAll('.fchip[data-t]').forEach(c=>c.classList.toggle('on',c.dataset.t===rvTopic));$('#ow').classList.toggle('on',rvWrong);
  const s=$('#rs').value.trim().toLowerCase(),hide=$('#hid').classList.contains('on'),w=wrongSet();
  let list=cur.q;
  if(rvTopic!=='all'){const t=cur.topics.find(x=>x.id===rvTopic);list=list.filter(q=>q.n>=t.from&&q.n<=t.to)}
  if(rvWrong)list=list.filter(q=>w.has(q.n));
  if(s)list=list.filter(q=>(q.n+' '+q.q+' '+q.code+' '+q.o.join(' ')).toLowerCase().includes(s));
  const mk=t=>{t=esc(t);if(!s)return t;const e=esc(s),i=t.toLowerCase().indexOf(e);return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+e.length)+'</mark>'+t.slice(i+e.length)};
  $('#rl').innerHTML=`<div class="mute" style="font-size:12.5px;margin:4px 2px 10px">Найдено: ${list.length}</div>`+(list.length?`<div class="panel">${list.map(q=>`<div class="qa"><div class="n">№${q.n}${w.has(q.n)?' · <span style="color:var(--bad)">ошибка</span>':''}</div><div class="q">${mk(q.q)}</div>${q.code?`<pre>${hl(q.code)}</pre>`:''}
    ${q.o.map((o,i)=>`<div class="o ${!hide&&i===q.a?'c':''}">${L[i]}) ${mk(o)}</div>`).join('')}
    ${hide?`<button class="reveal" onclick="revealA(this,${q.n})">Показать ответ</button>`:''}</div>`).join('')}</div>`:'');
}
function revealA(b,n){const q=byN(n);b.outerHTML=`<div class="o c" style="animation:rv .4s var(--ease) both">Ответ: ${L[q.a]}) ${esc(q.o[q.a])}</div>`}

function ask(msg,yes){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="panel box"><div style="font-weight:600;margin-bottom:18px">${esc(msg)}</div><div class="two"><button class="btn sec">Отмена</button><button class="btn">Да</button></div></div>`;document.body.appendChild(m);const [n,y]=m.querySelectorAll('button');const close=()=>m.remove();n.onclick=close;y.onclick=()=>{close();yes()};m.onclick=e=>{if(e.target===m)close()}}
function toast(msg){const d=document.createElement('div');d.className='panel toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>{d.style.transition='.4s';d.style.opacity=0},2200);setTimeout(()=>d.remove(),2700)}

/* --- particles --- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function sizeCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}sizeCv();addEventListener('resize',sizeCv);
const COLS=['#7c5cff','#22d3ee','#f472b6','#34d399','#fbbf24','#ffffff'];
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;cx.save();cx.globalAlpha=Math.min(1,p.life/30);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;if(p.s)cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);else{cx.beginPath();cx.arc(0,0,p.w/2,0,7);cx.fill()}cx.restore()});if(parts.length)raf=requestAnimationFrame(loop);else raf=0}
function emit(arr){if(RM)return;parts.push(...arr);if(!raf)raf=requestAnimationFrame(loop)}
function burst(el,n){if(!el)return;const r=el.getBoundingClientRect(),x=r.left+28,y=r.top+r.height/2;emit(Array.from({length:n},()=>{const a=Math.random()*Math.PI*2,s=2+Math.random()*4;return{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,g:.12,r:0,vr:.2,w:3+Math.random()*3,h:3,s:false,c:COLS[Math.random()*5|0],life:45+Math.random()*20}}))}
function confetti(){const W=innerWidth;emit(Array.from({length:150},(_,i)=>{const left=i%2===0;return{x:left?-10:W+10,y:innerHeight*.75,vx:(left?1:-1)*(5+Math.random()*9),vy:-(9+Math.random()*9),g:.25,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:4+Math.random()*4,s:true,c:COLS[Math.random()*COLS.length|0],life:140+Math.random()*60}}))}
home();
</script>
</body>
</html>
